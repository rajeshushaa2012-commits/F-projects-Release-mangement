  rows=rows.slice().sort((a,b)=>{
    if(rflt.sort==='teamAsc')return (a.team||'').localeCompare(b.team||'')||(a.jira||'').localeCompare(b.jira||'');
    if(rflt.sort==='jiraDesc')return (b.jira||'').localeCompare(a.jira||'');

  });

}

function exportMyReleaseCsv(){

    const month=r.relMonth!=null&&r.relMonth!==''?r.relMonth:relMonth(prod);
    const notes=r.milestones&&r.milestones.notes!=null?r.milestones.notes:'';
    rows.push([r.jira||'',r.team||'',AL(r.activity),SU(r.status),r.assignee||'',month||'',prod?fd(prod):'',notes||'']);
  });
  const csv=rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='my-release.csv';a.click();URL.revokeObjectURL(u);toast('Exported')}

}

/* ═══ New Development detail ═════════════ */
/* JIRA object types + labels used by the JIRA Objects editor.
   The editor works both on a saved record (rid = record id) and on the
   in-memory Add draft (rid = 'draft'), so objects — including an uploaded
   file — can be attached before the record is first saved. */
function joTarget(rid){return rid==='draft'?draftRelease:R(rid);}
/* Preserve unsaved main-form field values when a JIRA-object action forces a
   re-render (Add Object / Save / Delete). Reads the re-* inputs, if present,
   into the record/draft currently being edited. */
function syncRelFormFields(){
  if(!document.getElementById('re-jira'))return;
  const tgt=editingRelId==='draft'?draftRelease:R(editingRelId);
  if(!tgt)return;
  const g=id=>document.getElementById(id),d=g('re-date');
  tgt.nm=g('re-nm').value.trim();tgt.jira=g('re-jira').value.trim();
  tgt.team=g('re-team').value.trim();tgt.activity=g('re-activity').value;
  tgt.status=g('re-status').value;tgt.date=(d&&d.value)?d.value:null;
  tgt.assignee=g('re-assignee').value.trim();tgt.po=g('re-po').value.trim();
  tgt.scrum=g('re-scrum').value.trim();tgt.bizOwner=g('re-bizOwner').value.trim();
  tgt.financeUat=g('re-financeUat').value.trim();
}
function joAdd(rid,type){
  syncRelFormFields();
  const r=joTarget(rid);if(!r||!canEditRelease(r))return;
  r.jiraObjects=r.jiraObjects||blankJiraObjects();
  (r.jiraObjects[type]=r.jiraObjects[type]||[]).push({id:'JO'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'',note:'',file:'',data:''});
  joEdit[type+':'+(r.jiraObjects[type].length-1)]=true;draw();
}
function joDel(rid,type,i){
  const r=joTarget(rid);if(!r||!canEditRelease(r))return;
  if(!confirm('Remove this JIRA object?'))return;
  syncRelFormFields();
  r.jiraObjects[type].splice(i,1);delete joEdit[type+':'+i];
  if(rid!=='draft')persist();
  draw();toast('Removed');
}
function joToggle(type,i){syncRelFormFields();joEdit[type+':'+i]=!joEdit[type+':'+i];draw()}
function joSave(rid,type,i){
  const r=joTarget(rid);if(!r)return;
  syncRelFormFields();
  const obj=r.jiraObjects[type][i];
  obj.name=((document.getElementById('jon-'+type+'-'+i)||{}).value||'').trim();
  obj.note=((document.getElementById('jod-'+type+'-'+i)||{}).value||'').trim();
  const fileEl=document.getElementById('jof-'+type+'-'+i);
  const finish=()=>{joEdit[type+':'+i]=false;if(rid!=='draft')persist();draw();toast('Saved');};
  const f=fileEl&&fileEl.files&&fileEl.files[0];
  if(f){
    if(f.size>5*1024*1024){obj.file=f.name;obj.data='';toast('File over 5MB — name saved, contents skipped');finish();return;}
    const rd=new FileReader();
    rd.onload=()=>{obj.file=f.name;obj.data=rd.result;finish();};
    rd.onerror=()=>{toast('Could not read file');finish();};
    rd.readAsDataURL(f);
  }else{finish();}
}

/* ═══ conflict tracker → project tracker ═ */
function setCF(k,v){cflt[k]=v;cflt.page=1;draw()}
function clearCF(){cflt={q:'',sort:'jiraAsc',page:1};draw()}
/* The Conflict Tracker is a second editable view over the SAME New
   Development records (`rels`). Search spans the visible columns; sort
   mirrors the New Development grid's options. No project subsets — every
   New Development item is one row here. */
function filteredConflicts(){
  let rows=rels.slice();
  if(cflt.q){
    const q=cflt.q.toLowerCase();
    rows=rows.filter(r=>[r.jira,r.team,r.po,r.scrum,r.assignee,r.nm,AL(r.activity),SU(r.status)]
      .filter(Boolean).join(' ').toLowerCase().includes(q));
  }
  rows.sort((a,b)=>{
    if(cflt.sort==='jiraDesc')return (b.jira||'').localeCompare(a.jira||'');
    if(cflt.sort==='teamAsc')return (a.team||'').localeCompare(b.team||'')||(a.jira||'').localeCompare(b.jira||'');
    return (a.jira||'').localeCompare(b.jira||'');
  });
  return rows;
}
/* Display cell for each Conflict Tracker column — Activity and Status
   render as their shared chips so this view matches New Development. */
function cfCell(r,col){
  if(col.key==='activity')return actChip(r);
  if(col.key==='status')return stt(r.status);
  if(col.type==='date')return r.date?`<span class="mono" style="font-size:12px">${fd(r.date)}</span>`:DASH;
  const v=r[col.key];
  return v?E(v):DASH;
}

/* ═══ Conflict Tracker is VIEW ONLY ═══════
   No Add/Edit/Delete. The grid is a live, read-only projection of the

   whenever those source records change. Export (read-only) is retained. */
function exportConflictsCsv(){
  const rows=[['Sl.no',...CF_COLS.map(c=>c.h)]];
  filteredConflicts().forEach((r,i)=>rows.push([i+1,...CF_COLS.map(col=>{
    if(col.key==='activity')return AL(r.activity);
    if(col.key==='status')return SU(r.status);
    if(col.type==='date')return r.date?fd(r.date):'';
    return r[col.key]||'';
  })]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=`new-development-tracker.csv`;a.click();URL.revokeObjectURL(u);toast('Exported')}
  catch(e){navigator.clipboard?.writeText(csv);toast('Copied to clipboard')}

/* ═══ calendar ══════════════════════════ */
function evStatusCls(cur){return cur==='uatt'?'st-appr':cur==='prod'?'st-prod':cur==='done'?'st-done':''}
function vCal(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const cells=[];for(let i=0;i<start;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);while(cells.length%7)cells.push(null);
  const key=d=>`${y}-${P2(m+1)}-${P2(d)}`;
  const today=new Date(),todayKey=`${today.getFullYear()}-${P2(today.getMonth()+1)}-${P2(today.getDate())}`;
  const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthPrefix=`${y}-${P2(m+1)}`;
  const thisMonth=rels.filter(r=>r.plan&&r.plan.startsWith(monthPrefix)).length;
  const allPlanned=rels.filter(r=>r.plan&&r.cur!=='done').length;
  return head('cal','',[
    {label:`${thisMonth} in ${MF[m]} ${y}`,tone:'teal'},
    {label:`${allPlanned} upcoming overall`}
  ])+`<div class="cols"><div class="c"><div class="h"><h3>${MF[m]} ${y}</h3>
    <div class="r"><button class="bt s" onclick="calMonth=new Date(${y},${m-1},1);draw()">←</button>
    <button class="bt s" onclick="calMonth=new Date();draw()">Today</button>
    <button class="bt s" onclick="calMonth=new Date(${y},${m+1},1);draw()">→</button></div></div>
    <div class="b flush"><div class="cal">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d)return `<div class="dc o"></div>`;
        const isToday=key(d)===todayKey;
        const evs=rels.filter(r=>r.plan===key(d));
        return `<div class="dc ${isToday?'today':''}"><div class="dn ${isToday?'today':''}">${P2(d)}</div>
          ${evs.map(r=>`<div class="ev ${evStatusCls(r.cur)}" onclick="openR('${r.id}')">${r.ref}
            <div class="dv">${E(C(r.comp).nm)} · ${E(U(r.owner).nm)}</div></div>`).join('')}</div>`;
      }).join('')}
    </div>
    <div class="cal-legend">
      <div class="row"><span class="sw" style="background:var(--teal)"></span>In progress</div>
      <div class="row"><span class="sw" style="background:var(--wait)"></span>UAT Testing</div>
      <div class="row"><span class="sw" style="background:var(--navy)"></span>Production</div>
      <div class="row"><span class="sw" style="background:var(--go)"></span>Released</div>
    </div></div></div>
    <div>${calRail(monthPrefix,MF,m,y)}</div></div>`;
}
/* Calendar context rail — the schedule as a list, plus this month's
   gate mix. Both read straight from rels[].plan / rels[].cur. */
function calRail(monthPrefix,MF,m,y){
  const upcoming=rels.filter(r=>r.plan&&r.cur!=='done')
    .sort((a,b)=>a.plan.localeCompare(b.plan)).slice(0,6);
  const inMonth=rels.filter(r=>r.plan&&r.plan.startsWith(monthPrefix));
  const gateColor={uat:'var(--wait)',prod:'var(--navy)',done:'var(--go)'};
  const mix=countBy(inMonth,r=>SL(r.cur)).map(([label,count])=>{
    const rel=inMonth.find(r=>SL(r.cur)===label);
    return {label,val:count,color:gateColor[rel.cur]||'var(--teal)',
      pct:Math.round(count/inMonth.length*100)};
  });
  const list=upcoming.length?upcoming.map(r=>`<div class="srow">
      <span class="sw" style="background:${gateColor[r.cur]||'var(--teal)'}"></span>
      <span class="lbl">${E(r.nm)}</span>
      <span class="sub">${fdShort(r.plan)}</span></div>`).join('')
    :`<p style="color:var(--mut);font-size:12.5px">No releases have a planned date.</p>`;
  return panel('Next up',list,upcoming.length?`${upcoming.length} shown`:'')
   + panel(`${MF[m]} by gate`, statRows(mix,'Nothing scheduled this month.'));
}

/* ═══ change activity ═══════════════════ */
function vChg(){
  const unack=acts.filter(chgWaiting).length;
  const shownActs=acts.filter(chgMatch);
  return head('chg',canEdit()?`<button class="bt p" onclick="mPull()">Record a pull</button>`:'',[
    {label:`${acts.length} change event${acts.length!==1?'s':''} logged`},
    unack?{label:`${unack} awaiting acknowledgement`,tone:'wait'}:{label:'All acknowledged',tone:'go'}
  ])+`
  <div class="sec"><div class="mt">When someone pulls or applies changes, every other active owner of that component is alerted. The person who made the change is never notified about their own action.</div></div>
  <div class="c sec"><div class="h"><h3>${chgFilter.k!=='all'?E(chgFilterLabel()):'Change feed'} · ${shownActs.length}</h3>
      ${chgFilter.k!=='all'?`<div class="r"><button class="lk" onclick="setChgFilter('all',null)">Clear filter</button></div>`:''}</div>
    <div class="b flush"><div class="feed">${shownActs.length?
      shownActs.map(v=>{
        const others=C(v.comp).owners.filter(o=>o!==v.by&&U(o).active);
        const hot=others.includes(me)&&!v.ack.includes(me);
        return `<div class="fi"><div class="dot ${hot?'stop':'go'}"></div><div class="fc">
          <div class="ft">${E(U(v.by).nm)} ${E(v.act.toLowerCase())} on ${E(C(v.comp).nm)}${hot?` <span class="stt s-bad" style="margin-left:4px"><i></i>Needs ack</span>`:''}</div>
          <div class="fm">Notified: ${others.map(o=>E(U(o).nm)).join(', ')||'none'} · Acknowledged: ${v.ack.length?v.ack.map(o=>E(U(o).nm)).join(', '):'no one yet'}</div>
        </div><div class="fw">${fdRel(v.on)}</div>${hot?`<button class="bt s" style="margin-left:10px" onclick="ack('${v.id}')">Acknowledge</button>`:''}</div>`;
      }).join('')
      :acts.length?chartEmpty('🔍','Nothing in this view','No change events match this filter.')
      :chartEmpty('🔔','No change activity yet','Pulls and applied changes will be logged here.')}
  </div></div></div>
  <div class="summary">${chgRail()}</div>`;
}
/* Clicking a row in the Change rail filters the feed above it. */
let chgFilter={k:'all',v:null};
function setChgFilter(k,v){
  chgFilter=(chgFilter.k===k&&chgFilter.v===v)?{k:'all',v:null}:{k,v};
  draw();window.scrollTo(0,0);
}
const chgWaiting=v=>C(v.comp).owners.some(o=>o!==v.by&&U(o).active&&!v.ack.includes(o));
function chgMatch(v){
  const f=chgFilter;
  if(f.k==='ack')return chgWaiting(v)===f.v;
  if(f.k==='comp')return v.comp===f.v;
  if(f.k==='by')return v.by===f.v;
  return true;
}
function chgFilterLabel(){
  const f=chgFilter;
  if(f.k==='ack')return f.v?'Still waiting':'Fully acknowledged';
  if(f.k==='comp')return C(f.v).nm;
  if(f.k==='by')return U(f.v).nm;
  return '';
}
/* Change-activity rail: which components see the most churn, and who is
   driving it. Both counted straight from acts[]. */
function chgRail(){
  const compIds=[...new Set(acts.map(v=>v.comp))];
  const byComp=compIds.map(id=>({id,n:acts.filter(v=>v.comp===id).length}))
    .sort((a,b)=>b.n-a.n)
    .map(x=>({label:C(x.id).nm,val:x.n,color:'var(--teal)',pct:Math.round(x.n/acts.length*100),
      on:`setChgFilter('comp',${JSON.stringify(x.id)})`,
      active:chgFilter.k==='comp'&&chgFilter.v===x.id}));
  const byIds=[...new Set(acts.map(v=>v.by))];
  const byPerson=byIds.map(id=>({id,n:acts.filter(v=>v.by===id).length}))
    .sort((a,b)=>b.n-a.n)
    .map(x=>({label:U(x.id).nm,val:x.n,color:'var(--navy)',
      on:`setChgFilter('by',${JSON.stringify(x.id)})`,

async function sendManual(){
  const to=document.getElementById('mt').value.split(',').map(s=>s.trim()).filter(Boolean);
  const sub=document.getElementById('ms').value.trim(),bd=document.getElementById('mb').value.trim();
  if(!to.length||!sub||!bd){document.getElementById('e-mail').classList.add('on');return}
  document.getElementById('e-mail').classList.remove('on');
  const btn=document.getElementById('mSend');btn.disabled=true;btn.textContent='Sending…';
  const ok=await sendEmail(to,sub,bd);
  btn.disabled=false;btn.textContent='Send email';
  if(!ok)return;
  logAudit(`Sent manual email — "${sub}" to ${to.join(', ')}`,null,'—','—');
  document.getElementById('mt').value='';document.getElementById('ms').value='';document.getElementById('mb').value='';
  toast(`Sent to ${to.length} recipient${to.length!==1?'s':''}`);persist();

/* Clicking a row in the Notification rail filters the feed above it. */
let noteFilter={k:'all',v:null};
function setNoteFilter(k,v){
  noteFilter=(noteFilter.k===k&&noteFilter.v===v)?{k:'all',v:null}:{k,v};
  draw();window.scrollTo(0,0);
}
function noteMatch(n){
  const f=noteFilter;
  if(f.k==='ok')return n.ok===f.v;
  if(f.k==='ty')return n.ty===f.v;
  if(f.k==='to')return n.to.includes(f.v);
  return true;
}
function noteFilterLabel(){
  const f=noteFilter;
  if(f.k==='ok')return f.v?'Sent':'Retried';
  if(f.k==='ty')return f.v;
  if(f.k==='to')return `To ${U(f.v).nm}`;
  return '';
}
/* Notification rail: message mix, delivery outcome, and who actually
   receives mail — all counted from notifs[]. */
function noteRail(){
  const typeColors=['var(--navy)','var(--teal)','var(--info)','var(--go)','var(--wait)','var(--stop)'];
  const byType=countBy(notifs,n=>n.ty).map(([label,count],i)=>({label,val:count,
    color:typeColors[i%typeColors.length],pct:Math.round(count/notifs.length*100),
    on:`setNoteFilter('ty',${JSON.stringify(label)})`,
    active:noteFilter.k==='ty'&&noteFilter.v===label}));
  const okCount=notifs.filter(n=>n.ok).length;
  const delivery=[
    {label:'Sent',val:okCount,color:'var(--go)',on:"setNoteFilter('ok',true)",
      active:noteFilter.k==='ok'&&noteFilter.v===true},
    {label:'Retried',val:notifs.length-okCount,color:notifs.length-okCount?'var(--stop)':'var(--mut2)',
      on:"setNoteFilter('ok',false)",active:noteFilter.k==='ok'&&noteFilter.v===false},
  ];
  const recipIds=[...new Set(notifs.flatMap(n=>n.to))];
  const recips=recipIds.map(id=>({id,n:notifs.filter(x=>x.to.includes(id)).length}))
    .sort((a,b)=>b.n-a.n).slice(0,6)
    .map(x=>({label:U(x.id).nm,val:x.n,color:'var(--teal)',
      on:`setNoteFilter('to',${JSON.stringify(x.id)})`,
      active:noteFilter.k==='to'&&noteFilter.v===x.id}));
  return panel('Delivery',statRows(delivery))
   + panel('Message types',statRows(byType,'No messages logged yet.'))
   + panel('Most contacted',statRows(recips,'No recipients yet.'));
}

/* Clicking a row in the Audit rail filters the feed above it. */
let audFilter={k:'all',v:null};
function setAudFilter(k,v){
  audFilter=(audFilter.k===k&&audFilter.v===v)?{k:'all',v:null}:{k,v};
  draw();window.scrollTo(0,0);
}
const audIsTransition=a=>!!(a.prev&&a.prev!=='—');
function audMatch(a){
  const f=audFilter;
  if(f.k==='ac')return a.ac===f.v;
  if(f.k==='transition')return audIsTransition(a);
  if(f.k==='reason')return !!a.rs;
  if(f.k==='other')return !audIsTransition(a);
  return true;
}
function audFilterLabel(){
  const f=audFilter;
  if(f.k==='ac')return U(f.v).nm;
  if(f.k==='transition')return 'State transitions';
  if(f.k==='reason')return 'With a stated reason';
  if(f.k==='other')return 'Other actions';
  return '';
}
/* Audit rail: who is acting and how recently, from audit[] only. */
function audRail(){
  const actorIds=[...new Set(audit.map(a=>a.ac))];
  const byActor=actorIds.map(id=>({id,n:audit.filter(a=>a.ac===id).length}))
    .sort((a,b)=>b.n-a.n).slice(0,8)
    .map(x=>({label:U(x.id).nm,val:x.n,color:'var(--navy)',
      pct:Math.round(x.n/Math.max(1,audit.length)*100),
      on:`setAudFilter('ac',${JSON.stringify(x.id)})`,
      active:audFilter.k==='ac'&&audFilter.v===x.id}));
  const withReason=audit.filter(a=>a.rs).length;
  const transitions=audit.filter(audIsTransition).length;
  const shape=[
    {label:'State transitions',val:transitions,color:'var(--teal)',
      on:"setAudFilter('transition',null)",active:audFilter.k==='transition'},
    {label:'With a stated reason',val:withReason,color:withReason?'var(--wait)':'var(--mut2)',
      on:"setAudFilter('reason',null)",active:audFilter.k==='reason'},
    {label:'Other actions',val:audit.length-transitions,color:'var(--mut2)',
      on:"setAudFilter('other',null)",active:audFilter.k==='other'},
  ];
  const newest=audit.length?audit[0].on:null;
  return panel('Most active',statRows(byActor,'No audit entries yet.'),
      newest?`latest ${ageLabel(newest)}`:'')
   + panel('Entry types',statRows(shape));
}

${E(body)}</div></div>

function doApprove(rid,stage,gid){
  const r=R(rid),g=G(gid),rec=g.members.filter(m=>U(m).active);
  apps_.unshift({id:nid('A'),rel:rid,stage,grp:gid,by:me,on:now(),cond:g.cond,status:'open',dec:[],rem:0,esc:false});
  const prev=STATES[stageState(r,stage)][0];
  r.st[stage]='waiting';
  notifs.unshift({id:nid('N'),ty:'Approval request',sub:`Approval needed — ${r.ref} ${SL(stage)}`,to:rec,on:now(),ok:true});
  rec.forEach(m=>{
    const f=fillTmpl('Approval request',{approver:U(m).nm,ref:r.ref,name:r.nm,component:C(r.comp).nm,
      stage:SL(stage),owner:U(r.owner).nm,plannedDate:fd(r.plan),description:r.desc,validity:'72 hours'});
    if(f)sendEmail([U(m).em],f.subject,f.body);
  });
  logAudit(`Requested ${SL(stage)} approval`,rid,prev,'Waiting for approval');
  shut();draw();toast(`Sent to ${rec.length} approver${rec.length!==1?'s':''}`);persist();
}
function decide(aid,u,d,reason){
  const a=apps_.find(x=>x.id===aid),r=R(a.rel);
  a.dec.push({u,d,on:now(),c:reason||''});
  if(d==='rejected'){
    a.status='rejected';r.st[a.stage]='rejected';
    send('Approval outcome',`Rejected — ${r.ref} ${SL(a.stage)}`,[r.owner]);
    logAudit(`Recorded ${SL(a.stage)} rejection`,a.rel,'Waiting for approval','Rejected',reason||'');
    toast('Rejection recorded');
  }else{
    const g=G(a.grp),oks=a.dec.filter(x=>x.d==='approved').length;
    const met=a.cond==='any'?oks>=1:oks>=g.members.filter(m=>U(m).active).length;
    if(met){a.status='approved';r.st[a.stage]='approved';
      send('Approval outcome',`Approved — ${r.ref} ${SL(a.stage)}`,[r.owner]);
      logAudit(`Recorded ${SL(a.stage)} approval`,a.rel,'Waiting for approval','Approved');
      toast(`${SL(a.stage)} approved — tick recorded`);
    }else{logAudit(`Partial ${SL(a.stage)} approval`,a.rel,'Waiting for approval','Waiting for approval');
      toast('Recorded — still awaiting others')}
  }
  shut();draw();persist();
}

function advance(rid){
  const r=R(rid),[ok,why]=canAdvance(r);
  if(!ok){toast(why);return}
  const i=SI(r.cur),nx=STAGES[i+1],prev=SL(r.cur);
  if(stageState(r,r.cur)!=='approved')r.st[r.cur]='completed';
  r.cur=nx.k;r.st[nx.k]='inProgress';
  if(nx.k==='done'){r.st.done='completed';r.actual=now().slice(0,10);
    send('Release completed',`${r.ref} live in production`,
      [r.owner,...new Set(apps_.filter(a=>a.rel===rid).flatMap(a=>a.dec.map(d=>d.u)))])}
  logAudit('Advanced gate',rid,prev,nx.nm);
  draw();toast(`Moved to ${nx.nm}`);persist();
}

function doReturn(rid){

  const prev=SL(r.cur),ti=SI(to);

function setCond(gid,v){G(gid).cond=v;logAudit('Changed approval condition',null,'—',v);draw();toast('Condition updated');persist()}
function mUser(){
  show(`<div class="h"><h3>Add user</h3><p>The email held here is used for every approval and alert.</p></div>
  <div class="b"><div class="fg">
    <div><label>Name</label><input id="un"><div class="er" id="e-un">A name is required.</div></div>
    <div><label>Email</label><input id="ue" placeholder="name@corp.example"><div class="er" id="e-ue">A valid email is required.</div></div>
    <div><label>Role</label><select id="ur"><option>Release Management</option><option>Approver</option><option>Admin</option></select></div>
    <div><label>Responsibility</label><input id="up" placeholder="UAT approver — business"></div>
  </div></div>
  <div class="f"><button class="bt" onclick="shut()">Cancel</button><button class="bt p" onclick="doUser()">Add user</button></div>`);
}
function doUser(){
  const n=document.getElementById('un').value.trim(),e=document.getElementById('ue').value.trim();
  let bad=false;
  if(!n){document.getElementById('e-un').classList.add('on');bad=true}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){document.getElementById('e-ue').classList.add('on');bad=true}
  if(bad)return;
  users.push({id:nid('U'),nm:n,em:e,role:document.getElementById('ur').value,
    resp:document.getElementById('up').value.trim()||'—',comp:[],active:true});
  logAudit('Added user',null,'—',n);shut();draw();toast('User added');persist();
}
function runCycle(){
  let rem=0,es=0;
  apps_.filter(a=>a.status==='open').forEach(a=>{
    const g=G(a.grp),r=R(a.rel);
    const pend=g.members.filter(m=>!a.dec.some(d=>d.u===m)&&U(m).active);
    if(!pend.length)return;
    a.rem++;
    {const f=fillTmpl('Approval reminder',{approver:U(pend[0]).nm,ref:r.ref,requestedOn:fdt(a.on)});
     send('Approval reminder',`Reminder — ${r.ref} ${SL(a.stage)} still pending`,pend,f?f.body:undefined);}
    rem++;
    if(a.rem>=2&&!a.esc){a.esc=true;
      {const f=fillTmpl('Escalation',{escalation:U(g.esc).nm,ref:r.ref,pending:pend.map(p=>U(p).nm).join(', ')});
       send('Escalation',`Escalation — ${r.ref} ${SL(a.stage)} overdue`,[g.esc],f?f.body:undefined);}
      logAudit('Escalated pending approval',a.rel,'Waiting for approval','Waiting for approval',
        `No decision from ${pend.map(p=>U(p).nm).join(', ')} within ${g.escH}h`);es++}
  });
  draw();toast(rem?`${rem} reminder${rem!==1?'s':''} sent${es?`, ${es} escalated`:''}`:'Nothing pending');persist();
}
function exportCsv(){
  const rows=[['When','Who','Action','Release','Component','Previous','New','Reason']];
  audit.forEach(a=>rows.push([fdt(a.on),U(a.ac).nm,a.act,a.rel?R(a.rel).ref:'',
    a.comp?C(a.comp).nm:(a.rel?C(R(a.rel).comp).nm:''),a.prev,a.next,a.rs]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='release-audit-history.csv';a.click();URL.revokeObjectURL(u);toast('History exported')}
  catch(e){navigator.clipboard?.writeText(csv);toast('History copied to clipboard')}
}

boot();
</script>
